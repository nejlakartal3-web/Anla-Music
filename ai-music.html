<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Müzik - Anla-Music</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🎵 AI Müzik Oluştur</h1>
<p>Hayalindeki şarkıyı yapay zekâ ile oluştur.</p>
</header>

<main>

<section>

<h2>🎼 Şarkı Bilgileri</h2>

<p>Şarkı Adı</p>
<input type="text" placeholder="Şarkının adını yaz...">

<p>Müzik Türü</p>
<select>
<option>Pop</option>
<option>Rap</option>
<option>Rock</option>
<option>Arabesk</option>
<option>Türk Halk Müziği</option>
<option>Elektronik</option>
</select>

<p>Şarkının Duygusu</p>
<select>
<option>Mutlu 😊</option>
<option>Hüzünlü 😢</option>
<option>Romantik ❤️</option>
<option>Enerjik 🔥</option>
<option>Motivasyon 💪</option>
</select>

<p>Şarkı Açıklaması</p>
<textarea rows="6" placeholder="Örneğin: Yaz akşamında geçen romantik bir pop şarkısı oluştur."></textarea>

<br><br>

<button onclick="muzikOlustur()">🚀 Yapay Zekâ ile Oluştur</button>

</section>

<br>

<a href="index.html">
<button>🏠 Ana Sayfaya Dön</button>
</a>

</main>

<footer>
<p>© 2026 Anla-Music</p>
</footer>
<div class="music-generator">

<h2>🎤 AI Şarkı Sözü Üretici</h2>

<input id="songTitle" type="text" placeholder="Şarkı adı">

<input id="songTopic" type="text" placeholder="Konu (aşk, hayat, deniz...)">

<select id="songGenre">
<option>Pop</option>
<option>Rap</option>
<option>Rock</option>
<option>Arabesk</option>
<option>Slow</option>
<option>Türk Halk Müziği</option>
</select>

<select id="songMood">
<option>Mutlu</option>
<option>Hüzünlü</option>
<option>Romantik</option>
<option>Enerjik</option>
<option>Duygusal</option>
</select>

<button onclick="generateLyrics()">🎵 Şarkı Oluştur</button>

<div id="lyricsResult"></div>

</div>
<script>
function muzikOlustur() {
alert("🎵 Şarkın hazırlanıyor... Yapay zekâ müzik oluşturma sistemi yakında aktif olacak!");
}
</script>

</body>
</html>
