<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Müzik - Anla-Music</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🎵 AI Müzik Oluştur</h1>
<p>Hayalindeki şarkıyı yapay zekâ ile oluştur.</p>
</header>


<main>

<section>

<h2>🎼 Şarkı Bilgileri</h2>

<p>Şarkı Adı</p>
<input id="songTitle" type="text" placeholder="Şarkının adını yaz...">


<p>Müzik Türü</p>
<select id="songGenre">
<option>Pop</option>
<option>Rap</option>
<option>Rock</option>
<option>Arabesk</option>
<option>Slow</option>
<option>Türk Halk Müziği</option>
</select>


<p>Şarkının Duygusu</p>
<select id="songMood">
<option>Mutlu 😊</option>
<option>Hüzünlü 😢</option>
<option>Romantik ❤️</option>
<option>Enerjik 🔥</option>
<option>Motivasyon 💪</option>
</select>


<p>Şarkı Konusu</p>
<textarea id="songTopic" rows="5" placeholder="Örneğin: Deniz kıyısında geçen romantik bir aşk hikayesi..."></textarea>


<br><br>

<button onclick="generateLyrics()">
🎵 Şarkı Oluştur
</button>


<div id="lyricsResult"></div>


</section>


<br>


<a href="index.html">
<button>🏠 Ana Sayfaya Dön</button>
</a>


</main>


<footer>
<p>© 2026 Anla-Music</p>
</footer>



<script>

function generateLyrics(){

let title = document.getElementById("songTitle").value;
let genre = document.getElementById("songGenre").value;
let mood = document.getElementById("songMood").value;
let topic = document.getElementById("songTopic").value;


if(title === "" || topic === ""){
alert("Lütfen şarkı adı ve konusu yazın.");
return;
}


let lyrics = `
🎵 ${title}

Tarz: ${genre}
Duygu: ${mood}


1. Kıta:

${topic} ile başlayan bir hikaye,
Kalbimde saklı binlerce hece.
Geceler söyler eski şarkıları,
Umutla açılır yarın kapıları.


Nakarat:

Ben hâlâ buradayım,
Hayallerimle ayaktayım.
Sesim ulaşır uzaklara,
Bu şarkıyla yeniden doğarım.


2. Kıta:

Rüzgar taşır güzel anıları,
Yollar anlatır yaşananları.
Her nota yeni bir umut,
Her söz kalpte bir bulut.
`;


document.getElementById("lyricsResult").innerHTML =
`
<h2>${title}</h2>
<pre>${lyrics}</pre>
`;

}

</script>


</body>
</html>
