<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Müzik - Anla-Music</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>🎵 AI Müzik Oluştur</h1>
<p>Hayalindeki şarkıyı yapay zekâ ile oluştur.</p>
</header>

<main>

<section>

<h2>🎼 Şarkı Bilgileri</h2>

<p>Şarkı Adı</p>
<input type="text" placeholder="Şarkının adını yaz...">

<p>Müzik Türü</p>
<select>
<option>Pop</option>
<option>Rap</option>
<option>Rock</option>
<option>Arabesk</option>
<option>Türk Halk Müziği</option>
<option>Elektronik</option>
</select>

<p>Şarkının Duygusu</p>
<select>
<option>Mutlu 😊</option>
<option>Hüzünlü 😢</option>
<option>Romantik ❤️</option>
<option>Enerjik 🔥</option>
<option>Motivasyon 💪</option>
</select>

<p>Şarkı Açıklaması</p>
<textarea rows="6" placeholder="Örneğin: Yaz akşamında geçen romantik bir pop şarkısı oluştur."></textarea>

<br><br>

<button onclick="muzikOlustur()">🚀 Yapay Zekâ ile Oluştur</button>

</section>

<br>

<a href="index.html">
<button>🏠 Ana Sayfaya Dön</button>
</a>

</main>

<footer>
<p>© 2026 Anla-Music</p>
</footer>

<script>
function muzikOlustur() {
alert("🎵 Şarkın hazırlanıyor... Yapay zekâ müzik oluşturma sistemi yakında aktif olacak!");
}
</script>

</body>
</html>
